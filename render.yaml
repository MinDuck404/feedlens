# Render Blueprint cho backend FeedLens (chế độ cloud, nhiều tài khoản).
# Mở: https://dashboard.render.com/blueprint/new?repo=https://github.com/MinDuck404/feedlens
# DATABASE_URL được hỏi khi tạo; FEEDLENS_SECRET do Render tự sinh (dùng để ký phiên và mã hóa API key của user,
# đừng đổi sau khi đã có user, nếu không các key đã lưu sẽ không giải mã được).
# API key AI do từng user tự nhập trên web, không đặt ở đây.
services:
  - type: web
    name: feedlens-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FEEDLENS_MODE
        value: cloud
      - key: FEEDLENS_CORS
        value: https://minduck404.github.io
      - key: FEEDLENS_ALLOW_SIGNUP
        value: "true"
      # Chế độ "Server": lướt bằng cookie user lưu (mã hóa). Đặt "false" để tắt.
      - key: FEEDLENS_SERVER_SCRAPE
        value: "true"
      - key: FEEDLENS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
