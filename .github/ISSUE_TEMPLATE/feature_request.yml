name: Feature request / Đề xuất tính năng
description: Explain a user problem and the smallest useful improvement.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "Check ROADMAP.md first. Vietnamese or English is welcome. Do not share private posts or credentials."
  - type: textarea
    id: problem
    attributes:
      label: User problem / Vấn đề bạn gặp
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Useful outcome / Kết quả mong muốn
      description: Give one concrete example and describe how you would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / Cách đang làm tạm
      description: Optional alternatives, relevant platform/mode and tradeoffs you would accept.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / Kiểm tra thông tin cá nhân
      options:
        - label: I removed personal information and secrets from all logs, images and attachments (or attached none). / Tôi đã xoá thông tin cá nhân và bí mật khỏi log, ảnh và tệp (hoặc không đính kèm).
          required: true
