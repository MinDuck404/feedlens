[project]
name = "feedlens"
version = "0.3.5"
description = "Lướt feed/group mạng xã hội bằng phiên đăng nhập của chính bạn, phân loại và tóm tắt bài viết bằng Claude."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.60",
    "google-genai>=1.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.48",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=5",
    "python-multipart>=0.0.20",
    "tzdata>=2025",  # Pacific-day quota reset also works on Windows without a system tz database.
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
feedlens = "feedlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["feedlens/**/*.py", "feedlens/**/*.json", "feedlens/**/*.js", "feedlens/**/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["feedlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
