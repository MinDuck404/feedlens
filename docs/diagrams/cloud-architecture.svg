<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" style="background:#FAF7F0;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#5C534A" />
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#24527A" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#AE3824" />
    </marker>
  </defs>

  <!-- Title &amp; Eyebrow Header -->
  <g transform="translate(40, 36)">
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#AE3824">DEPLOYMENT TOPOLOGY · MULTI-USER CLOUD</text>
    <text font-family="'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif" font-size="23" font-weight="600" fill="#16120E" y="28">Cloud Architecture</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5C534A" y="48">Zero-cookie cloud backend: user agents scrape locally and stream structured posts via token fla_</text>
  </g>

  <!-- Container 1: Local Machine -->
  <g transform="translate(40, 116)">
    <rect width="264" height="312" rx="10" fill="#F3EDE2" stroke="#DDD5C7" stroke-width="1.2" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.08em" fill="#AE3824" x="16" y="24">ZONE 1 · YOUR COMPUTER</text>
    <text font-family="'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif" font-size="15" font-weight="600" fill="#16120E" x="16" y="44">Local Machine (Residential IP)</text>

    <!-- Node 1: feedlens agent -->
    <g transform="translate(16, 60)">
      <rect width="232" height="96" rx="6" fill="#FFFFFF" stroke="#16120E" stroke-width="1.4" />
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" fill="#24527A" x="12" y="20">CLI BACKGROUND DAEMON</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="40">feedlens agent</text>
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#AE3824" x="12" y="58">token fla_xxx (Bearer auth)</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="74">Polls server queue every 2 seconds</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="88">Pushes raw scraped items via HTTPS</text>
    </g>

    <!-- CDP Connector -->
    <path d="M 132 156 L 132 184" stroke="#5C534A" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" fill="none" />
    <rect x="72" y="164" width="120" height="16" rx="3" fill="#F3EDE2" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" fill="#7D7368" text-anchor="middle" x="132" y="176">Chrome DevTools (CDP)</text>

    <!-- Node 2: Chrome Browser -->
    <g transform="translate(16, 188)">
      <rect width="232" height="96" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" fill="#5C534A" x="12" y="20">LOCAL AUTOMATION</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="40">Chrome (Dedicated Profile)</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="58">Headed browser with active user session</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="74">Natural human scrolling cadence</text>
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#2E6E4D" x="12" y="88">No datacenter IP blocks</text>
    </g>
  </g>

  <!-- Connector: Agent <-> Backend -->
  <path d="M 304 220 L 360 220" stroke="#AE3824" stroke-width="1.6" marker-end="url(#arrow-accent)" fill="none" />
  <rect x="306" y="202" width="56" height="16" rx="3" fill="#FAF7F0" stroke="#AE3824" stroke-width="0.8" />
  <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" font-weight="600" fill="#AE3824" text-anchor="middle" x="334" y="214">token fla_</text>

  <!-- Container 2: Cloud Backend -->
  <g transform="translate(364, 116)">
    <rect width="300" height="312" rx="10" fill="#F3EDE2" stroke="#DDD5C7" stroke-width="1.2" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.08em" fill="#AE3824" x="16" y="22">ZONE 2 · CLOUD SERVER</text>
    <text font-family="'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif" font-size="14.5" font-weight="600" fill="#16120E" x="16" y="40">FastAPI Cloud Backend</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#7D7368" x="16" y="54">(Render / Docker / Managed)</text>

    <!-- Node 3: FastAPI Core -->
    <g transform="translate(16, 62)">
      <rect width="268" height="122" rx="6" fill="#FFFFFF" stroke="#16120E" stroke-width="1.4" />
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" fill="#AE3824" x="12" y="18">CORE WEB SERVICE</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="38">FastAPI Application</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="56">• User auth &amp; session tokens</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="72">• Run orchestration &amp; task queue</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="88">• Fernet key encryption (FEEDLENS_SECRET)</text>
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#24527A" x="12" y="106">AI dispatch with caller's own API key</text>
    </g>

    <!-- Connector: FastAPI -> Postgres -->
    <path d="M 150 184 L 150 214" stroke="#5C534A" stroke-width="1.3" marker-end="url(#arrow)" fill="none" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" fill="#7D7368" text-anchor="middle" x="150" y="202">SQLAlchemy / SSL</text>

    <!-- Node 4: Postgres DB -->
    <g transform="translate(16, 218)">
      <rect width="268" height="74" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" fill="#5C534A" x="12" y="18">PERSISTENCE TIER</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="38">PostgreSQL Database</text>
      <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="56">User accounts · Digest archives · Hashed fla_ tokens</text>
    </g>
  </g>

  <!-- Container 3: Frontend &amp; External AI -->
  <g transform="translate(714, 116)">
    <!-- Frontend Box -->
    <g>
      <rect width="206" height="140" rx="10" fill="#F3EDE2" stroke="#DDD5C7" stroke-width="1.2" />
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.08em" fill="#24527A" x="16" y="22">ZONE 3 · CLIENT INGRESS</text>
      <text font-family="'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif" font-size="14" font-weight="600" fill="#16120E" x="16" y="40">GitHub Pages SPA</text>
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#7D7368" x="16" y="54">(Static CDN Ingress)</text>

      <g transform="translate(14, 60)">
        <rect width="178" height="66" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
        <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#16120E" x="10" y="22">React 18 + Vite SPA</text>
        <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="10" y="38">Newspaper-style reader UI</text>
        <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#7D7368" x="10" y="54">VITE_API_URL → Cloud FastAPI</text>
      </g>
    </g>

    <!-- AI Providers Box -->
    <g transform="translate(0, 168)">
      <rect width="206" height="144" rx="10" fill="#F3EDE2" stroke="#DDD5C7" stroke-width="1.2" />
      <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.08em" fill="#AE3824" x="16" y="24">ZONE 4 · AI PROVIDERS</text>
      <text font-family="'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif" font-size="14.5" font-weight="600" fill="#16120E" x="16" y="44">External LLM Services</text>

      <g transform="translate(14, 58)">
        <rect width="178" height="72" rx="6" fill="rgba(174, 56, 36, 0.08)" stroke="#AE3824" stroke-width="1.2" />
        <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#16120E" x="10" y="24">Gemini · Claude · OpenAI</text>
        <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="10" y="40">Decrypted per-call in memory</text>
        <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#AE3824" x="10" y="56">Server holds NO owner quota</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 714 190 L 668 190" stroke="#24527A" stroke-width="1.4" marker-end="url(#arrow-link)" fill="none" />
  <rect x="670" y="174" width="44" height="16" rx="3" fill="#FAF7F0" stroke="#24527A" stroke-width="0.8" />
  <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7" font-weight="600" fill="#24527A" text-anchor="middle" x="692" y="186">REST</text>

  <path d="M 664 250 L 688 250 L 688 350 L 714 350" stroke="#AE3824" stroke-width="1.4" marker-end="url(#arrow-accent)" fill="none" />
  <rect x="668" y="292" width="40" height="16" rx="3" fill="#FAF7F0" stroke="#AE3824" stroke-width="0.8" />
  <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7" font-weight="600" fill="#AE3824" text-anchor="middle" x="688" y="304">AI API</text>

  <!-- Bottom Security Callout -->
  <g transform="translate(40, 442)">
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5C534A">SECURITY PRINCIPLE: Social cookies stay on your machine unless you opt in to Server (cookie) mode.</text>
  </g>
</svg>