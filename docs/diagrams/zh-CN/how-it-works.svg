<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" style="background:#FAF7F0;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#5C534A" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#AE3824" />
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#24527A" />
    </marker>
  </defs>

  <!-- Title &amp; Eyebrow Header -->
  <g transform="translate(40, 36)">
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#AE3824">本地优先数据流 · 隐私与高可用</text>
    <text font-family="'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', 'Lora', serif" font-size="23" font-weight="600" fill="#16120E" y="28">FeedLens 工作原理</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="11.5" fill="#5C534A" y="48">使用个人 Chrome 会话在家庭 IP 浏览，原始数据存入本地 SQLite，AI 独立分析</text>
  </g>

  <!-- Step 1: User Chrome -->
  <g transform="translate(40, 126)">
    <rect width="152" height="110" rx="8" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <rect x="12" y="12" width="128" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#5C534A" x="18" y="24">步骤 1 · 浏览器</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">个人 Chrome</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="10" fill="#5C534A" x="12" y="66">独立用户配置目录</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" fill="#7D7368" x="12" y="82">家庭宽带 IP · 无需上传密码</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" fill="#AE3824" x="12" y="97">密码永不离开本地设备</text>
  </g>

  <path d="M 192 181 L 208 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 2: Scraper Engine -->
  <g transform="translate(212, 126)">
    <rect width="168" height="110" rx="8" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <rect x="12" y="12" width="144" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#5C534A" x="18" y="24">步骤 2 · 采集</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">采集引擎</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="10" fill="#5C534A" x="12" y="66">提取动态与群组帖子</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" fill="#7D7368" x="12" y="82">拟人化滚动与浏览节奏</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" fill="#5C534A" x="12" y="97">FB · LinkedIn · X · Reddit</text>
  </g>

  <path d="M 380 181 L 396 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 3: Raw SQLite -->
  <g transform="translate(400, 126)">
    <rect width="156" height="110" rx="8" fill="#FFFFFF" stroke="#16120E" stroke-width="1.5" />
    <rect x="12" y="12" width="132" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#16120E" x="18" y="24">步骤 3 · 原始存储</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">SQLite 数据库</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="9.5" font-weight="600" fill="#24527A" x="12" y="66">feedlens.db（原始帖子）</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="9.5" fill="#5C534A" x="12" y="82">原始数据持久化保存</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" font-weight="600" fill="#2E6E4D" x="12" y="97">数据解耦，安全无忧</text>
  </g>

  <path d="M 556 181 L 572 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 4: AI &amp; CV -->
  <g transform="translate(576, 126)">
    <rect width="176" height="110" rx="8" fill="rgba(174, 56, 36, 0.08)" stroke="#AE3824" stroke-width="1.5" />
    <rect x="12" y="12" width="152" height="18" rx="4" fill="#AE3824" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#FFFFFF" x="18" y="24">步骤 4 · AI 与简历</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">AI 综合分析与匹配</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="10" fill="#5C534A" x="12" y="66">Gemini · Claude · OpenAI</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" fill="#7D7368" x="12" y="82">10 大分类整理 · 生成摘要</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" font-weight="600" fill="#AE3824" x="12" y="97">简历岗位契合度评分</text>
  </g>

  <path d="M 752 181 L 768 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 5: Web Digest (Generous 148px width) -->
  <g transform="translate(772, 126)">
    <rect width="148" height="110" rx="8" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <rect x="12" y="12" width="124" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#5C534A" x="18" y="24">步骤 5 · 阅读</text>
    <text font-family="'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', 'Lora', serif" font-size="14" font-weight="600" fill="#16120E" x="12" y="48">网页公报</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="10" fill="#5C534A" x="12" y="66">报纸排版风格</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" fill="#7D7368" x="12" y="82">报纸式版面</text>
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8.5" fill="#5C534A" x="12" y="97">支持 vi / en / zh</text>
  </g>

  <!-- Auxiliary CV Context Box -->
  <g transform="translate(576, 28)">
    <rect width="176" height="64" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#24527A" x="12" y="20">辅助上下文</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#16120E" x="12" y="36">求职档案 (CV)</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="9" fill="#5C534A" x="12" y="52">主要岗位 · 求职条件 · 相近岗位</text>
  </g>
  <path d="M 664 92 L 664 122" stroke="#24527A" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow-link)" fill="none" />

  <!-- Failure Box -->
  <path d="M 664 236 L 664 278" stroke="#AE3824" stroke-width="1.3" marker-end="url(#arrow-accent)" fill="none" />
  <g transform="translate(576, 282)">
    <rect width="176" height="64" rx="6" fill="rgba(174, 56, 36, 0.08)" stroke="#AE3824" stroke-width="1.2" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#AE3824" x="12" y="20">故障处理</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="11" font-weight="600" fill="#16120E" x="12" y="36">AI 额度超限或网络超时</text>
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="9" fill="#5C534A" x="12" y="52">零数据丢失：原始帖子完好保存</text>
  </g>

  <!-- Loopback arrow from Failure to Step 3 SQLite -->
  <path d="M 576 314 L 478 314 L 478 240" stroke="#2E6E4D" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />
  <g transform="translate(390, 303)">
    <rect width="176" height="22" rx="4" fill="#FAF7F0" stroke="#2E6E4D" stroke-width="1" />
    <text font-family="ui-monospace, 'Geist Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="8" font-weight="600" fill="#2E6E4D" text-anchor="middle" x="88" y="15">↺ 一键重新分析（无需重新采集）</text>
  </g>

  <!-- Footnote -->
  <g transform="translate(40, 396)">
    <circle cx="6" cy="6" r="4" fill="#AE3824" />
    <text font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Geist', sans-serif" font-size="10" fill="#5C534A" x="18" y="10">解耦架构设计：采集在本地 IP 运行；AI 限流或网络异常绝不会丢弃已采集的文章内容。</text>
  </g>
</svg>