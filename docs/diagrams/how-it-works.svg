<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" style="background:#FAF7F0;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#5C534A" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#AE3824" />
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#24527A" />
    </marker>
  </defs>

  <!-- Title & Eyebrow Header -->
  <g transform="translate(40, 36)">
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#AE3824">LOCAL-FIRST DATAFLOW · PRIVACY & RESILIENCE</text>
    <text font-family="'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif" font-size="23" font-weight="600" fill="#16120E" y="28">How FeedLens Works</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5C534A" y="48">Chrome with your own session scrapes feeds, saves raw posts to SQLite, then analyzes with AI</text>
  </g>

  <!-- Step 1: User Chrome -->
  <g transform="translate(40, 126)">
    <rect width="152" height="110" rx="8" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <rect x="12" y="12" width="128" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#5C534A" x="18" y="24">STEP 1 · BROWSER</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">Your Chrome</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5C534A" x="12" y="66">Dedicated user profile</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#7D7368" x="12" y="82">Residential IP session</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#AE3824" x="12" y="97">No password leaves device</text>
  </g>

  <path d="M 192 181 L 208 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 2: Scraper Engine -->
  <g transform="translate(212, 126)">
    <rect width="168" height="110" rx="8" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <rect x="12" y="12" width="144" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#5C534A" x="18" y="24">STEP 2 · SCRAPE</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">Scraper Engine</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5C534A" x="12" y="66">Feed & group extraction</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#7D7368" x="12" y="82">Human-like scroll cadence</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#5C534A" x="12" y="97">FB · LinkedIn · X · Reddit</text>
  </g>

  <path d="M 380 181 L 396 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 3: Raw SQLite -->
  <g transform="translate(400, 126)">
    <rect width="156" height="110" rx="8" fill="#FFFFFF" stroke="#16120E" stroke-width="1.5" />
    <rect x="12" y="12" width="132" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#16120E" x="18" y="24">STEP 3 · RAW STORE</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">SQLite Database</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" fill="#24527A" x="12" y="66">feedlens.db (raw posts)</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#5C534A" x="12" y="82">Raw data preserved safely</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" fill="#2E6E4D" x="12" y="97">Decoupled persistence</text>
  </g>

  <path d="M 556 181 L 572 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 4: AI & CV -->
  <g transform="translate(576, 126)">
    <rect width="176" height="110" rx="8" fill="rgba(174, 56, 36, 0.08)" stroke="#AE3824" stroke-width="1.5" />
    <rect x="12" y="12" width="152" height="18" rx="4" fill="#AE3824" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#FFFFFF" x="18" y="24">STEP 4 · AI & CV</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16120E" x="12" y="48">AI Synthesis & Match</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5C534A" x="12" y="66">Gemini · Claude · OpenAI</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#7D7368" x="12" y="82">Topic digest · 10 categories</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" fill="#AE3824" x="12" y="97">CV job match scoring</text>
  </g>

  <path d="M 752 181 L 768 181" stroke="#5C534A" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />

  <!-- Step 5: Web Digest (Generous 148px width) -->
  <g transform="translate(772, 126)">
    <rect width="148" height="110" rx="8" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <rect x="12" y="12" width="124" height="18" rx="4" fill="#ECE5D8" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#5C534A" x="18" y="24">STEP 5 · DIGEST</text>
    <text font-family="'Lora', 'Georgia', 'Cambria', 'Times New Roman', serif" font-size="14" font-weight="600" fill="#16120E" x="12" y="48">Web Digest</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5C534A" x="12" y="66">Newspaper layout</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#7D7368" x="12" y="82">Newspaper layout</text>
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#5C534A" x="12" y="97">vi / en / zh</text>
  </g>

  <!-- Auxiliary CV Context Box -->
  <g transform="translate(576, 28)">
    <rect width="176" height="64" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1.2" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#24527A" x="12" y="20">AUXILIARY CONTEXT</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#16120E" x="12" y="36">User CV Profile</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="52">Target roles · Criteria · Bridge roles</text>
  </g>
  <path d="M 664 92 L 664 122" stroke="#24527A" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow-link)" fill="none" />

  <!-- Failure Box -->
  <path d="M 664 236 L 664 278" stroke="#AE3824" stroke-width="1.3" marker-end="url(#arrow-accent)" fill="none" />
  <g transform="translate(576, 282)">
    <rect width="176" height="64" rx="6" fill="rgba(174, 56, 36, 0.08)" stroke="#AE3824" stroke-width="1.2" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.06em" fill="#AE3824" x="12" y="20">FAILURE HANDLING</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#16120E" x="12" y="36">AI Rate Limit / Timeout</text>
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5C534A" x="12" y="52">Zero data loss: raw posts kept</text>
  </g>

  <!-- Loopback arrow from Failure to Step 3 SQLite -->
  <path d="M 576 314 L 478 314 L 478 240" stroke="#2E6E4D" stroke-width="1.4" marker-end="url(#arrow)" fill="none" />
  <g transform="translate(390, 303)">
    <rect width="176" height="22" rx="4" fill="#FAF7F0" stroke="#2E6E4D" stroke-width="1" />
    <text font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600" fill="#2E6E4D" text-anchor="middle" x="88" y="15">↺ 1-Click Re-Analyze (No Re-Scrape)</text>
  </g>

  <!-- Footnote -->
  <g transform="translate(40, 396)">
    <circle cx="6" cy="6" r="4" fill="#AE3824" />
    <text font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5C534A" x="18" y="10">Decoupled design: Scraping runs on your IP; AI tokens and network failures never discard collected articles.</text>
  </g>
</svg>